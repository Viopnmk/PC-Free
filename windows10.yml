# PC-Free · Windows 10 for GitHub Codespaces (free-tier tuned)
# 底层镜像: dockurr/windows (QEMU/KVM, 从微软官方源自动下载并无人值守安装 Windows)
services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME:-kao}
      PASSWORD: ${WINDOWS_PASSWORD:-123456}
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "32G"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - /tmp/docker-data/windows:/storage
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    stop_grace_period: 2m
    restart: "no"
